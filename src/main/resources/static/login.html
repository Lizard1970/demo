<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
<div class="bg-white p-8 rounded-lg shadow w-80">
    <h2 class="text-xl font-bold mb-6 text-center">登录</h2>
    <div class="mb-4">
        <label class="block mb-1">用户名</label>
        <input id="username" class="border w-full px-3 py-2 rounded">
    </div>
    <div class="mb-6">
        <label class="block mb-1">密码</label>
        <input id="password" type="password" class="border w-full px-3 py-2 rounded">
    </div>
    <button onclick="login()" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600">登录</button>
</div>

<script>
    function login() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        if (!username || !password) {
            alert("账号密码不能为空");
            return;
        }
        fetch("/user/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        })
            .then(res => res.json())
            .then(res => {
                if (res.code === 200) {
                    localStorage.setItem("token", res.data);
                    location.href = "/user.html";
                } else {
                    alert(res.msg);
                }
            })
    }
</script>
</body>
</html>
