spring:
  application:
    name: demo
    datasource:
      driver-class-name: org.postgresql.Driver
      url: ${DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true # 下划线自动转驼峰，数据库user_type → userType
  global-config:
    db-config:
      id-type: auto

token:
  header: Authorization
  secret: ${TOKEN_SECRET}
  expireTime: ${TOKEN_EXPIRE_TIMS:72}  #72为默认值，环境变量不存在就用72

