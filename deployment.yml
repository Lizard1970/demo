apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-name
  namespace: demo-ns
spec:
  replicas: 4
  selector:
    matchLabels:
      app: demo-label
  template:
    metadata:
      labels:
        app: demo-label
    spec:
      containers:
        - name: contain-name
          image: 192.168.139.30:5000/demo/test:v1
          ports:
          - containerPort: 8080
      imagePullSecrets:
        - name: harbor-secret

---
apiVersion: v1
kind: Service
metadata:
  name: svc-lzt
spec:
  type: NodePort
  selector:
    app: demo-label
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-demo
  namespace: demo-ns
spec:
  ingressClassName: nginx
  rules:
  - host: lizard.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: svc-lzt
            port:
              number: 8080

