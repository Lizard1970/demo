apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: demo
          image: 192.168.139:5000/demo/test:v1
          ports:
          - containerPort: 8080
      imagePullSecrets:
        - name: harbor-secret
