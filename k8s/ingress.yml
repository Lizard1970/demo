apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-demo
  namespace: demo-ns
spec:
  ingressClassName: nginx
  rules:
    - host: lark.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: svc-lzt
                port:
                  number: 8080

