# api版本，Secret归属核心v1 API组
apiVersion: v1
#资源类型:Secret，存放密码、密钥这类敏感数据
kind: Secret
metadata:
  #Secret资源名称，deployment里envFrom引该名字
  name: demo-secret
  #和deployment保持在同一个命名空间
  namespace: demo-ns
#Opaque: 通用自定义密钥类型，最常用
type: Opaque
#data内的值必须是base64编译后的字符串
data:
  #数据库密码，原值123456
  DB_PASSWORD: MTIzNDU2
  #TOKEN加密密码，secret: xpqsyUwn6CZz5FdCdCUpJIGSa0eUchnYXk8uLXrAF1MtzGYDxl7788LyLhM8mMZE
  TOKEN_SECRET: eHBxc3lVd242Q1p6NUZkQ2RDVXBKSUdTYTBlVWNobllYazh1TFhyQUYxTXR6R1lEeGw3Nzg4THlMaE04bU1aRQ==